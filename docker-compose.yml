# FlowForge local stack. Phase 1: IB Gateway (paper), Redis, TimescaleDB and the read-only
# IBKR paper check. Phase 4: watchdog and the kill switch command. Later phases add the
# trading node, API and dashboard. Copy .env.example to .env first.

services:
  ib-gateway:
    # Pinned: "stable" line, Gateway 10.50.1f with IBC 3.24.2 (docs/research/08, B7-B8).
    image: ghcr.io/gnzsnz/ib-gateway:10.50.1f
    restart: always
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: paper            # live is a separate, operator-approved change
      # Operator decision 2026-10-24: the Nautilus IB execution client needs write access to
      # connect (IB error 321 in read-only mode). Paper only; no strategies exist yet.
      READ_ONLY_API: "no"
      TWOFA_TIMEOUT_ACTION: restart
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:?set VNC_SERVER_PASSWORD in .env}  # VNC only starts when set
      AUTO_RESTART_TIME: "11:59 PM"
      TZ: America/New_York
    ports:
      - "127.0.0.1:4002:4004"        # paper API, localhost only
      - "127.0.0.1:5900:5900"        # VNC for the weekly manual login, localhost only
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/4004'"]
      interval: 30s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6.7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_DB: flowforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 10s

  ib-paper-check:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["check"]              # run on demand: docker compose --profile check run --rm ib-paper-check
    environment:
      IB_HOST: ib-gateway
      IB_PORT: "4004"
      IB_CLIENT_ID: "91"
      IB_TRADING_MODE: paper
      IB_ACCOUNT_ID: ${IB_ACCOUNT_ID}
    volumes: ["./reports:/app/reports"]
    depends_on:
      ib-gateway: {condition: service_healthy}
    command: ["python", "-m", "flowforge.ops.ib_paper_check", "--seconds", "60"]

  # Backtest: offline, no broker connection. Step by step in docs/runbooks/backtest.md.
  bars-download:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["backtest"]
    environment:
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
    volumes: ["./data:/app/data"]
    command: ["python", "-m", "flowforge.data.alpaca_bars", "--out", "data/bars"]

  # Phase 2: past trades + NBBO quotes into the Parquet catalog (docs/runbooks/tick-download.md).
  ticks-download:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["data"]
    environment:
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
    volumes: ["./data:/app/data"]
    command: ["python", "-m", "flowforge.data.alpaca_ticks", "--out", "data/ticks"]

  # Phase 2: watch Alpaca's live stream through the node, no trading (docs/runbooks/live-stream.md).
  live-watch:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["data"]
    environment:
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
    volumes: ["./data:/app/data", "./reports:/app/reports"]
    command: ["python", "-m", "flowforge.data.alpaca_live", "--feed", "test", "--symbols", "FAKEPACA", "--seconds", "60"]

  backtest:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["backtest"]
    volumes: ["./data:/app/data:ro", "./reports:/app/reports"]
    command: ["python", "-m", "flowforge.backtest.run", "--data", "data/bars"]

  # Phase 3: order-flow features from downloaded ticks, offline (docs/runbooks/features.md).
  features:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["features"]
    volumes: ["./data:/app/data", "./reports:/app/reports"]
    command: ["python", "-m", "flowforge.features.replay", "--ticks", "data/ticks", "--out", "data/features"]

  # Phase 3 exit gate: same ticks through replay, backtest and the live client must match.
  features-parity:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["features"]
    volumes: ["./data:/app/data", "./reports:/app/reports"]
    command: ["python", "-m", "flowforge.features.parity", "--ticks", "data/ticks", "--symbol", "SPY", "--day", "2026-10-23"]

  # Phase 5: walk-forward test of the pre-registered signals (docs/runbooks/walkforward.md).
  # Offline, no orders. Add --jev to also test the Jev gate (needs TYPESAFE_API_KEY).
  walkforward:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["research"]
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    volumes: ["./data:/app/data", "./reports:/app/reports"]
    command: ["python", "-m", "flowforge.research.walkforward", "--features", "data/features", "--ticks", "data/ticks", "--out", "reports/phase5"]

  # Phase 5: fast simulator vs full Nautilus backtest on one stock-day.
  crosscheck:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["research"]
    volumes: ["./data:/app/data", "./reports:/app/reports"]
    entrypoint: ["python", "-m", "flowforge.research.crosscheck", "--ticks", "data/ticks", "--out", "reports/phase5"]

  # Phase 4: kill switch and halts (docs/runbooks/kill-switch.md). Anyone may turn it on:
  #   docker compose run --rm riskctl kill --reason "why"
  riskctl:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["ops"]
    volumes: ["flowforge-run:/var/run/flowforge", "./data:/app/data"]
    entrypoint: ["python", "-m", "flowforge.ops.riskctl"]
    command: ["status"]

  # Phase 4: watches the kill switch and the node heartbeat; flattens on its own if the
  # node is gone (docs/runbooks/kill-switch.md). Paper only, same guards as the paper check.
  watchdog:
    build: {context: ., dockerfile: docker/node.Dockerfile}
    profiles: ["paper"]
    restart: unless-stopped
    environment:
      IB_HOST: ib-gateway
      IB_PORT: "4004"
      IB_CLIENT_ID: "${IB_NODE_CLIENT_ID:-11}"   # the trading node's id: only it can cancel the node's orders
      IB_TRADING_MODE: paper
      IB_ACCOUNT_ID: ${IB_ACCOUNT_ID}
    volumes: ["flowforge-run:/var/run/flowforge", "./data:/app/data"]
    depends_on:
      ib-gateway: {condition: service_healthy}
    command: ["python", "-m", "flowforge.ops.watchdog"]

volumes:
  redis-data:
  pg-data:
  flowforge-run:   # kill switch flag + node heartbeat, shared by node, watchdog and riskctl
